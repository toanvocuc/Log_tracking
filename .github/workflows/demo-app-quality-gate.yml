name: Demo App Quality Gate

on:
  push:
  pull_request:

jobs:
  demo-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r demo_app/requirements.txt

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          PYTHONPATH=src pytest -q

      - name: Start demo app with Docker Compose
        working-directory: demo_app
        run: |
          docker compose up --build -d

      - name: Wait for demo app to become ready
        run: |
          sleep 5

      - name: Generate demo traffic
        run: |
          chmod +x scripts/generate_traffic.sh
          ./scripts/generate_traffic.sh

      - name: Run log quality gate
        run: |
          chmod +x scripts/run_log_quality_gate.sh
          ./scripts/run_log_quality_gate.sh

      - name: Show generated report
        run: |
          cat reports/demo_app_report.txt

      - name: Upload log and report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-quality-gate-artifacts
          path: |
            demo_app/logs/app.log
            reports/demo_app_report.txt

      - name: Stop demo app
        if: always()
        working-directory: demo_app
        run: |
          docker compose down
